plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'pl.zooolw.radiormf'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.zooolw.radiormf'
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Stały klucz podpisu: kolejne wersje instalują się jako aktualizacja.
    signingConfigs {
        shared {
            storeFile rootProject.file('radio-rmf.keystore')
            storePassword 'radiormf'
            keyAlias 'radiormf'
            keyPassword 'radiormf'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
